stages:
  # ---- Main platform: Chess.com (the player-facing data) ----
  ingest:
    cmd: python -m src.data.game_ingest
    deps:
      - src/data/game_ingest.py
      - src/data/chess_com_client.py
    params:
      - data.username
      - data.max_months
    outs:
      - data/raw/bonc_1_games.json:
          cache: true

  extract_targets:
    cmd: python -m src.data.blunder_detector
    deps:
      - src/data/blunder_detector.py
      - src/data/game_parser.py
      - src/data/chess_com_client.py
      - src/engine/stockfish_manager.py
      - data/raw/bonc_1_games.json
    params:
      - blunder.cp_drop_threshold
      - blunder.win_prob_drop_threshold
      - engine.depth
      - extract.max_games
    outs:
      - data/candidate_bank/legal_positions.json:
          cache: true

  # ---- Base dataset: Lichess (pretrains the global neural model) ----
  ingest_base:
    cmd: python -m src.data.lichess_base_ingest
    deps:
      - src/data/lichess_base_ingest.py
      - src/data/lichess_client.py
    params:
      - base_data.usernames
      - base_data.max_games_per_user
      - base_data.perf_type
    outs:
      - data/raw/lichess_base_games.json:
          cache: true

  extract_base:
    cmd: python -m src.data.lichess_base_extract
    deps:
      - src/data/lichess_base_extract.py
      - src/data/lichess_base_ingest.py
      - src/data/lichess_client.py
      - src/data/game_parser.py
      - src/data/blunder_detector.py
      - src/engine/stockfish_manager.py
      - data/raw/lichess_base_games.json
    params:
      - blunder.cp_drop_threshold
      - blunder.win_prob_drop_threshold
      - engine.depth
      - base_data.max_extract_games
    outs:
      - data/candidate_bank/lichess_base.json:
          cache: true

  train_base:
    cmd: python -m src.training.train_base
    deps:
      - src/models/board_encoder.py
      - src/models/history_gru.py
      - src/models/scenario_network.py
      - src/training/dataset.py
      - src/training/train.py
      - src/training/train_base.py
      - src/tracking.py
      - src/data/validation.py
      - src/data/lichess_base_extract.py
      - src/data/game_parser.py
      - data/raw/lichess_base_games.json
      - data/candidate_bank/lichess_base.json
    params:
      - train.epochs
      - train.batch_size
      - train.lr
      - train.embedding_dim
      - train.hidden_dim
    outs:
      - models_saved/scenario_model.pt:
          cache: true

  evaluate:
    cmd: python -m src.training.evaluate
    deps:
      - src/data/validation.py
      - src/tracking.py
      - src/training/evaluate.py
      - src/models/baseline_knn.py
      - src/training/dataset.py
      - models_saved/scenario_model.pt
      - data/candidate_bank/legal_positions.json
      - data/raw/bonc_1_games.json
    params:
      - data.username
      - extract.max_games
    metrics:
      - metrics.json:
          cache: false

  # Offline usefulness harness: chronological holdout + baselines, logged to
  # MLflow. Depends on versioned demo-user datasets so a fresh clone can run it.
  evaluate_usefulness:
    cmd: python -m src.training.evaluate_usefulness
    deps:
      - src/tracking.py
      - src/data/validation.py
      - src/training/evaluate_usefulness.py
      - src/training/train.py
      - src/training/dataset.py
      - src/models/scenario_network.py
      - models_saved/scenario_model.pt
      - data/raw/bonc_1_games.json
      - data/raw/1tshassan_games.json
      - data/candidate_bank/users/bonc_1.json
      - data/candidate_bank/users/1tshassan.json
    outs:
      - metrics_usefulness.json:
          cache: false
